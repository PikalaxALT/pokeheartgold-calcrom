[package]
name = "calcrom"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
cached = "2.0.2"
clap = { version = "4.6.1", features = ["derive"] }
conv = "0.3.3"
elf = "0.8.0"
itertools = "0.15.0"
log = { version = "0.4.32", features = ["release_max_level_info", "max_level_debug"] }
regex = "1.12.3"

[profile.dev]
debug = 2

[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
